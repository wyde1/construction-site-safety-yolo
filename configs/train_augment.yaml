# Portable YOLO11 training & custom data augmentation configuration for Construction Site Safety.
# Pass the dataset path explicitly via CLI or Python API (`model.train(data=..., cfg="configs/train_augment.yaml")`).
#
# Reproducibility note: compared to the historical augment.yaml used during early experiments,
# this clean config removes local Windows paths and enables `pretrained: true` for COCO transfer learning.

task: detect
mode: train
epochs: 50
patience: 50
batch: 16
imgsz: 640
pretrained: true
optimizer: auto
lr0: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
save: true
plots: true

# Domain-aware data augmentation for outdoor construction sites
hsv_h: 0.02        # Mild hue jitter across different safety vest / hardhat colors
hsv_s: 0.8         # Stronger saturation variation for sun/shadow conditions
hsv_v: 0.5         # Brightness variation for overcast vs bright outdoor lighting
translate: 0.2     # Camera framing shift tolerance
scale: 0.7         # Distance variation (close-up PPE vs wide site cameras)
shear: 2.0         # Slight viewing-angle tilt
perspective: 0.001 # Mild perspective distortion from elevated CCTV cameras
flipud: 0.0        # Disabled: workers, hardhats, and machinery do not appear upside down
fliplr: 0.5        # Horizontal mirroring for left/right viewpoint diversity
mosaic: 1.0        # Multi-image mosaic to improve small-object (Gloves, Hardhat, Mask) recall
mixup: 0.2         # Image blending regularization on a compact 717-image dataset
